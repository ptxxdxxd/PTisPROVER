# Fixture 4 of the original z3-rubric-prover, rewritten in the rubric file format.
# Whenever fast_response pays, standard_response pays too.
id = "redundant-latency"
exploit_threshold = 0.85

[variables]
response_latency_ms = { type = "int", min = 1, max = 1000 }
accuracy = { type = "real", min = 0, max = 1 }

[[criteria]]
id = "fast_response"
weight = 0.40
when = "response_latency_ms <= 50"

[[criteria]]
id = "standard_response"
weight = 0.30
when = "response_latency_ms <= 100"

[[criteria]]
id = "accurate"
weight = 0.30
when = "accuracy >= 0.92"

[[invariants]]
id = "accuracy_floor"
holds = "accuracy >= 0.90"
